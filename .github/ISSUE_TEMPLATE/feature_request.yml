name: Feature request
description: Suggest an idea or a new construct to support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve?, placeholder: "When I change a column in ..., I can't see ..." }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: Proposed solution }
  - type: textarea
    id: example
    attributes: { label: Minimal synthetic example (SQL / DAX / TMDL snippet), render: text }
