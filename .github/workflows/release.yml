name: Release

# Push a tag such as v2.3.1 to build the Python packages and the portable zip,
# attach them to a GitHub release and publish the Docker image to GHCR.
# Uses only the built-in GITHUB_TOKEN; no other secrets are required.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          V=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('lineagelens/__init__.py').read_text(encoding='utf-8')).group(1))")
          test "v$V" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $V"; exit 1; }
      - name: Test
        run: |
          python -m pip install -e ".[dev]"
          python -X warn_default_encoding -W error::EncodingWarning -m pytest -q
      - name: Build sdist, wheel and portable zip
        run: |
          python -m pip install build
          python -m build
          git archive --format=zip --prefix="LineageLens-${GITHUB_REF_NAME#v}/" -o "dist/LineageLens-${GITHUB_REF_NAME#v}.zip" HEAD
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {if (p) exit} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "LineageLens $V" --notes-file notes.md --verify-tag

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/lineagelens
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
