name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # Never let UTF-8 mode hide locale-encoding bugs: on Windows this keeps the
      # legacy cp1252 default that real users have.
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Show encodings
        shell: bash
        run: python -c "import locale, sys; print('locale', locale.getpreferredencoding(False), '| stdout', sys.stdout.encoding, '| utf8_mode', sys.flags.utf8_mode)"
      - name: Tests (implicit locale encoding is an error)
        run: python -X warn_default_encoding -W error::EncodingWarning -m pytest -q
      - name: CLI smoke test (console output)
        shell: bash
        run: |
          lineagelens --version
          S=$(python -c "import lineagelens, pathlib; print(pathlib.Path(lineagelens.__file__).parent / 'samples')")
          lineagelens diff "$S/dbt/target/manifest.json" "$S/dbt_changed/target/manifest.json" -m report.md --fail-on never > console.txt
          head -n 3 console.txt
          python -X warn_default_encoding -W error::EncodingWarning -c "import pathlib; t = pathlib.Path('report.md').read_text(encoding='utf-8'); assert 'breaking change' in t, t[:200]"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image
        run: docker build -t lineagelens:ci .
      - name: Smoke test
        run: |
          docker run -d --name ll -p 127.0.0.1:8765:8765 --read-only --tmpfs /tmp --cap-drop ALL lineagelens:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8765/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8765/ | grep -q '<div id="root">'
          test "$(docker inspect -f '{{.Config.User}}' lineagelens:ci)" = "10001:10001"
      - name: Logs
        if: always()
        run: docker logs ll || true
