[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lineagelens"
version = "2.3.1"
description = "Column-level impact analysis from dbt / Snowflake to Power BI measures, RLS and visuals. Local, offline, deterministic."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
authors = [{ name = "Dhruvpuri Goswami" }]
maintainers = [{ name = "Dhruvpuri Goswami" }]
keywords = ["lineage", "column-level lineage", "dbt", "snowflake", "power bi", "impact analysis", "tmdl", "pbir", "pbip", "dax", "data governance"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
# Exact pins: same, tested versions on every machine.
dependencies = [
  "sqlglot==30.24.0",
  "networkx==3.7; python_version >= '3.12'",
  "networkx==3.5; python_version < '3.12'",
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "pydantic==2.14.1",
  "uvicorn==0.54.0",
  "typer==0.27.3",
  "click==8.5.0",
  "PyYAML==6.0.3",
  "RapidFuzz==3.14.6",
  "openpyxl==3.1.5",
  "python-multipart==0.0.32",   # streaming multipart parser for in-app uploads
]

[project.urls]
Homepage = "https://github.com/dhruvpuri-goswami/LineageLens"
Repository = "https://github.com/dhruvpuri-goswami/LineageLens.git"
Issues = "https://github.com/dhruvpuri-goswami/LineageLens/issues"
Changelog = "https://github.com/dhruvpuri-goswami/LineageLens/blob/main/CHANGELOG.md"
Documentation = "https://github.com/dhruvpuri-goswami/LineageLens#readme"
Security = "https://github.com/dhruvpuri-goswami/LineageLens/security/policy"

[project.optional-dependencies]
snowflake = ["snowflake-connector-python==5.1.0"]
fabric = ["azure-identity==1.26.0"]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
lineagelens = "lineagelens.cli:run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lineagelens*"]

[tool.setuptools.package-data]
lineagelens = ["static/**/*", "samples/**/*", "samples_large/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Any implicit locale-encoding text I/O is an error. EncodingWarning is only emitted when
# Python runs with `-X warn_default_encoding` (or PYTHONWARNDEFAULTENCODING=1), which CI
# and `make test` do on every OS. This catches Windows cp1252 bugs on Linux and macOS too.
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx`", "error::EncodingWarning"]
