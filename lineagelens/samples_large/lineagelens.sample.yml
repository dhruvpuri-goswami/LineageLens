# LARGE synthetic sample bundled with LineageLens (fictional "Helios Retail Group").
# Used to test readability / performance at scale. Generated by tools/make_large_sample.py.
project_name: Helios Retail Group (large sample)

dbt:
  - project_dir: dbt

snowflake:
  view_dirs: [snowflake_views]
  default_database: HELIOS
  default_schema: REPORTING

powerbi:
  semantic_models: [powerbi/CommercialAnalytics.SemanticModel, powerbi/FinanceInsights.SemanticModel, powerbi/SupplyChain.SemanticModel]
  reports: [powerbi/Budget vs Actual.Report, powerbi/Customer 360.Report, powerbi/Digital Marketing.Report, powerbi/Inventory Control.Report, powerbi/PnL Review.Report, powerbi/Sales Executive.Report, powerbi/Supplier Performance.Report]
  report_model_map: {}

naming:
  case_insensitive: true
  enable_fuzzy: true
  fuzzy_threshold: 90
